[project]
name = "surfski"
version = "0.1.0"
description = "Self-hosted remote MCP server for multi-account Gmail with per-user isolation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "cryptography>=43",
    "anyio>=4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://surfski.io"
Repository = "https://github.com/rayhu/surfski"
Issues = "https://github.com/rayhu/surfski/issues"

[project.scripts]
surfski = "surfski.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surfski"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
