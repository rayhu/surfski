name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the runtime (Docker image, .python-version); 3.12 is the
        # declared minimum (requires-python) for pip/uv installs.
        python: ["3.14", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tags after v7)
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck --version && shellcheck scripts/*.sh

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: surfski:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image refuses to start without configuration
        run: |
          set +e
          out="$(docker run --rm surfski:ci 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::container exited 0 without configuration"
            exit 1
          fi
          if ! grep -q "refusing to start" <<<"$out"; then
            echo "::error::expected 'refusing to start' in container output"
            exit 1
          fi
