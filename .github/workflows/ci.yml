name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the runtime (Docker image, .python-version); 3.12 is the
        # declared minimum (requires-python) for pip/uv installs.
        python: ["3.14", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.0 (no floating major tags after v7)
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck --version && shellcheck scripts/*.sh

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: surfski:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image refuses to start without configuration
        run: |
          set +e
          out="$(docker run --rm surfski:ci 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::container exited 0 without configuration"
            exit 1
          fi
          if ! grep -q "refusing to start" <<<"$out"; then
            echo "::error::expected 'refusing to start' in container output"
            exit 1
          fi
      - name: Admin CLI works in the hardened container
        run: |
          set -euo pipefail
          key() { python3 -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"; }
          {
            echo "BASE_URL=https://mcp.example.com"
            echo "GOOGLE_CLIENT_ID=cid.apps.googleusercontent.com"
            echo "GOOGLE_CLIENT_SECRET=GOCSPX-ci"
            echo "ALLOWED_USERS=ci@example.com"
            echo "JWT_SIGNING_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "STATE_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "STORAGE_ENCRYPTION_KEY=$(key)"
            echo "TOKEN_ENCRYPTION_KEY=$(key)"
          } > ci.env
          docker volume create surfski-ci-data
          run() {
            docker run --rm --env-file ci.env -e DATA_DIR=/data -v surfski-ci-data:/data \
              --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
              surfski:ci "$@"
          }
          run surfski admin list
          # Attachment extraction sandbox (#30) works under the read-only, cap_drop ALL setup.
          run python -c "
          import time
          from surfski.sandbox import Sandbox
          s = Sandbox()
          t = time.monotonic()
          ex = s.extract(b'<p>sandbox ok</p>', 'text/html', 'x.html', charset=None, max_chars=100)
          assert ex.text == 'sandbox ok', ex
          print(f'sandboxed extraction ok in {time.monotonic() - t:.3f}s')
          "
          # Kernel confinement (#43): in the hardened container the worker gets Landlock + seccomp,
          # can't read /data/data.db (which the server user can) and can't open a socket.
          echo "host kernel: $(uname -r); LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '?')"
          docker run --rm --env-file ci.env -e DATA_DIR=/data -e EXTRACT_SANDBOX_STRICT=true \
            -v surfski-ci-data:/data -v "$PWD/scripts/ci_sandbox_probe.py:/tmp/probe.py:ro" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            surfski:ci python -I /tmp/probe.py
          run surfski admin rotate-token-key --dry-run
          set +e
          run surfski admin purge-owner --owner ci@example.com
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::purge-owner without --yes should exit 1, got $code"
            exit 1
          fi
